<style>
/* The loading outline: drawn from this page alone, before the stylesheet and the code arrive (on a slow phone, seconds).
   The same colours as css/app.css, in the saved theme (js/first.js puts it on <html>) or the phone's own. */
:root { --sk-bg: #0F172A; --sk-a: #192134; --sk-b: #1F2A42; --sk-ink: #9AA6C0; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --sk-bg: #F3F5F9; --sk-a: #FFFFFF; --sk-b: #EAEEF5; --sk-ink: #55607A; } }
:root[data-theme="light"] { --sk-bg: #F3F5F9; --sk-a: #FFFFFF; --sk-b: #EAEEF5; --sk-ink: #55607A; }
html { background: var(--sk-bg); }
body { margin: 0; }
.skel { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 0; display: flex; flex-direction: column; gap: 12px; }
.skel i, .skel b { display: block; border-radius: 14px; background: var(--sk-a); }
.sk-top { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.sk-brand { font: 700 1.125rem system-ui, sans-serif; color: var(--sk-ink); }
.skel .sk-dot { width: 36px; height: 36px; border-radius: 50%; }
.sk-hero { height: 180px; } .sk-row { height: 56px; } .sk-row.short { width: 60%; }
.sk-tabs { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--sk-a); display: flex; justify-content: space-around; align-items: center; }
.skel .sk-tabs i { width: 28px; height: 28px; border-radius: 8px; background: var(--sk-b); }
.skel .sk-tabs b { width: 56px; height: 56px; border-radius: 50%; margin-top: -24px; background: var(--sk-b); }
.sk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .skel i, .skel b { animation: sk-pulse 1.2s ease-in-out infinite alternate; } }
@keyframes sk-pulse { to { opacity: .55; } }
</style>
